name: Verify OFT Conv2d forward-merge parity
on:
  push:
    branches: [fix/oft-conv2d-rotation-forward-merge-parity-20261015]
  pull_request:
    paths:
      - "src/peft/tuners/oft/layer.py"
      - "tests/test_oft_conv2d_parity.py"
jobs:
  oft-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install torch, project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch pytest
          python -m pip install -e .
      - name: Targeted OFT forward/merge/gradient regression
        run: python -m pytest -q tests/test_oft_conv2d_parity.py
