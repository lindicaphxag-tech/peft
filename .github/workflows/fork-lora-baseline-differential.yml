name: PEFT tied-LoRA source-base vs repair differential
on:
  push:
    branches: [fix/lora-tied-adapter-upcast-preserve-shared-storage-20261014]
    paths:
      - src/peft/tuners/lora/model.py
      - tests/test_lora_tied_dtype_storage.py
      - .github/workflows/fork-lora-baseline-differential.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  both-source-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install identical actual model dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest pytest-cov
      - name: Original pinned upstream model must FAIL tied-storage regression
        shell: bash
        run: |
          git show 20f82b52cb690b249cb90cbab43af49d005ab510:src/peft/tuners/lora/model.py > src/peft/tuners/lora/model.py
          set +e
          python -m pytest -q -o addopts='' tests/test_lora_tied_dtype_storage.py > original_expected_fail.log 2>&1
          baseline_status=$?
          set -e
          tail -n 32 original_expected_fail.log
          if [ "$baseline_status" -eq 0 ]; then
            echo "ERROR: Original upstream unexpectedly passes regression; no proven repair." >&2
            exit 1
          fi
          echo "BASELINE_REPRODUCED_FAILURE=YES"
      - name: Proposed source fix must PASS the exact same tests and dependencies
        shell: bash
        run: |
          git restore src/peft/tuners/lora/model.py
          python -m pytest -q -o addopts='' tests/test_lora_tied_dtype_storage.py
          echo "SAME_TEST_PATCH_PASS=YES"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-cpu-original-broken-vs-patch-correct-proof
          path: original_expected_fail.log
