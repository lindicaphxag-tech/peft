name: Fork-only LoRA low-precision tied-adapter correctness
on:
  push:
    branches: [fix/lora-tied-adapter-upcast-preserve-shared-storage-20261014]
    paths:
      - src/peft/tuners/lora/model.py
      - tests/test_lora_tied_dtype_storage.py
      - .github/workflows/fork-lora-tied-storage.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-tie-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU model and package
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest pytest-cov
      - run: python -m pytest -q tests/test_lora_tied_dtype_storage.py
